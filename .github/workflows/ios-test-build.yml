name: ios-test-build

# An unsigned iPhone build of a work-in-progress branch, for sideloading onto
# a test device (Sideloadly / AltStore) from a machine that is not a Mac.
#
# Deliberately NOT the release pipeline (build.yml): no version guards and no
# tagged release. The .ipa is attached to the run as an artifact AND published
# to one rolling `koop-ios` pre-release with a SideStore source, so a test
# phone subscribed to it gets one-tap updates. Needs no secrets: with no GoogleService-Info.plist
# the Xcode build phase writes an inert placeholder, and .env is left blank.

on:
  workflow_dispatch:
  push:
    branches: ['whoop-ui']

permissions:
  # write: the job publishes the .ipa and the SideStore source to the
  # rolling `koop-ios` release so SideStore can offer one-tap updates.
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          # Same pin as build.yml — verified against this codebase.
          flutter-version: '3.41.6'

      - name: Write blank .env
        run: |
          echo "COMPANION_URL=" > .env
          echo "BACKEND_URL=" >> .env

      - name: Install flutterfire (required by Crashlytics Xcode build phase)
        run: dart pub global activate flutterfire_cli 1.4.0

      - run: flutter pub get

      - name: Build unsigned iOS app
        # A version that rises on every run (0.10.<run>), so SideStore sees each
        # push as an update; the pubspec version stays the release line.
        run: >
          flutter build ios --release --no-codesign --dart-define-from-file=.env
          --build-name=0.10.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      # Same reason as build.yml: a Watch companion cannot survive a per-user
      # free-account resign, so the .ipa would not install with it inside.
      - name: Strip Watch companion
        run: rm -rf "build/ios/iphoneos/Runner.app/Watch"

      # The home-screen widget extension uses an App Group, which a free
      # Apple ID often cannot sign; a sideload then fails with "No code
      # signature found". A test copy does not need the widget.
      - name: Strip app extensions
        run: rm -rf "build/ios/iphoneos/Runner.app/PlugIns"

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr -y "$GITHUB_WORKSPACE/openstrap-edge-test-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-test-ipa
          path: openstrap-edge-test-unsigned.ipa
          retention-days: 14

      # One-tap updates: the rolling `koop-ios` release always holds the newest
      # koop.ipa and the SideStore source pointing at it. Subscribe once to
      #   https://raw.githubusercontent.com/<owner>/<repo>/sidestore/apps.json
      # and SideStore shows "Update" whenever this job runs.
      - name: Generate SideStore source
        run: |
          cp openstrap-edge-test-unsigned.ipa koop.ipa
          python3 .github/scripts/gen_koop_source.py \
            koop.ipa apps.json "${{ github.repository }}" koop-ios

      - name: Publish to the koop-ios release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: koop-ios
          name: Koop for iPhone (rolling)
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Rolling iPhone build of the whoop-ui branch.
            Add this source in SideStore: https://raw.githubusercontent.com/${{ github.repository }}/sidestore/apps.json
          files: |
            koop.ipa
            apps.json

      # The source SideStore subscribes to lives on its own `sidestore` branch
      # and is read as a raw file: a release asset answers with a redirect to a
      # signed storage URL, which SideStore failed to decode. Raw is one plain
      # response at a fixed address.
      - name: Update the sidestore branch
        run: |
          git clone --depth 1 --branch sidestore \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/ss
          cp apps.json /tmp/ss/apps.json
          cd /tmp/ss
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apps.json
          if ! git diff --cached --quiet; then
            git commit -m "Koop build ${{ github.run_number }}"
            git push
          fi
